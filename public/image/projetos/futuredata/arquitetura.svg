<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-label="Diagrama de arquitetura do FutureData: painel interno e portal do cliente em Blade/Alpine, monólito Laravel com controllers por módulo, API interna para o n8n, automação de OS com Evolution API, WhatsApp e agente de IA, e bancos MySQL, Redis e Meilisearch.">
  <defs>
    <marker id="aFd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4d8dff"/>
    </marker>
    <marker id="aFd2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="700" rx="16" fill="#0b0f14"/>

  <!-- Título -->
  <text x="40" y="44" fill="#e6e8ee" font-size="24" font-weight="700">Arquitetura — FutureData</text>
  <text x="40" y="70" fill="#8b93a3" font-size="15">Monólito Laravel (Blade + Alpine) · painel interno, portal do cliente e automação de OS via n8n &amp; WhatsApp</text>

  <!-- ===== Clientes (esquerda) ===== -->
  <g>
    <rect x="40" y="110" width="240" height="78" rx="10" fill="#111820" stroke="#2a3340"/>
    <text x="60" y="140" fill="#e6e8ee" font-size="16" font-weight="600">Painel interno</text>
    <text x="60" y="164" fill="#9aa3b2" font-size="13.5">Blade + Alpine.js</text>

    <rect x="40" y="206" width="240" height="78" rx="10" fill="#111820" stroke="#2a3340"/>
    <text x="60" y="236" fill="#e6e8ee" font-size="16" font-weight="600">Portal do cliente</text>
    <text x="60" y="260" fill="#9aa3b2" font-size="13.5">Blade · acesso por token</text>
  </g>

  <!-- ===== Laravel (centro) ===== -->
  <g>
    <rect x="360" y="110" width="320" height="340" rx="12" fill="#101a2b" stroke="#4d8dff" stroke-width="1.5"/>
    <text x="380" y="140" fill="#e6e8ee" font-size="17" font-weight="700">Laravel 13 — Monólito</text>
    <text x="380" y="161" fill="#6f7788" font-size="12">PHP 8.3+ · Blade · Alpine · Vite</text>

    <rect x="380" y="176" width="280" height="52" rx="8" fill="#0d1420" stroke="#2a3340"/>
    <text x="396" y="197" fill="#cfd5df" font-size="14" font-weight="600">routes/web</text>
    <text x="396" y="217" fill="#8b93a3" font-size="12.5">public · auth · app · painel</text>

    <rect x="380" y="238" width="280" height="56" rx="8" fill="#0d1420" stroke="#2a3340"/>
    <text x="396" y="259" fill="#cfd5df" font-size="14" font-weight="600">Controllers/App (módulos)</text>
    <text x="396" y="279" fill="#8b93a3" font-size="11.5">Ordens · Clientes · Estoque · Caixa · Financeiro…</text>

    <rect x="380" y="304" width="280" height="44" rx="8" fill="#0d1420" stroke="#2a3340"/>
    <text x="396" y="331" fill="#cfd5df" font-size="14" font-weight="600">Portal (controllers do cliente)</text>

    <rect x="380" y="358" width="280" height="76" rx="8" fill="#0d1420" stroke="#f59e0b" stroke-width="1.3"/>
    <text x="396" y="380" fill="#f6c667" font-size="14" font-weight="600">routes/api.php — interna</text>
    <text x="396" y="400" fill="#cfd5df" font-size="12.5">token em header</text>
    <text x="396" y="420" fill="#8b93a3" font-size="12">eventos de OS → n8n</text>
  </g>

  <!-- ===== Automação (direita) ===== -->
  <g>
    <rect x="760" y="110" width="210" height="62" rx="10" fill="#111820" stroke="#2a3340"/>
    <text x="780" y="138" fill="#e6e8ee" font-size="15" font-weight="600">n8n</text>
    <text x="780" y="158" fill="#9aa3b2" font-size="12.5">workflow de OS</text>

    <rect x="760" y="188" width="210" height="58" rx="10" fill="#111820" stroke="#2a3340"/>
    <text x="780" y="214" fill="#e6e8ee" font-size="15" font-weight="600">Agente IA</text>
    <text x="780" y="233" fill="#9aa3b2" font-size="12.5">Anthropic SDK</text>

    <rect x="760" y="262" width="210" height="58" rx="10" fill="#111820" stroke="#2a3340"/>
    <text x="780" y="288" fill="#e6e8ee" font-size="15" font-weight="600">Evolution API</text>
    <text x="780" y="307" fill="#9aa3b2" font-size="12.5">envio de mensagens</text>

    <rect x="760" y="336" width="210" height="58" rx="10" fill="#111820" stroke="#2a3340"/>
    <text x="780" y="362" fill="#e6e8ee" font-size="15" font-weight="600">WhatsApp</text>
    <text x="780" y="381" fill="#9aa3b2" font-size="12.5">cliente</text>
  </g>

  <!-- ===== Persistência (base) ===== -->
  <g>
    <text x="40" y="512" fill="#6f7788" font-size="13" font-weight="600" letter-spacing="1">PERSISTÊNCIA</text>
    <rect x="40" y="526" width="280" height="92" rx="10" fill="#111820" stroke="#2a3340"/>
    <text x="60" y="556" fill="#e6e8ee" font-size="15" font-weight="600">MySQL 8.4</text>
    <text x="60" y="578" fill="#9aa3b2" font-size="12.5">dados da aplicação (Sail)</text>
    <text x="60" y="599" fill="#6f7788" font-size="11.5">OS · clientes · equipamentos · peças · caixa · vendas</text>

    <rect x="340" y="526" width="200" height="92" rx="10" fill="#111820" stroke="#2a3340"/>
    <text x="360" y="556" fill="#e6e8ee" font-size="15" font-weight="600">Redis</text>
    <text x="360" y="578" fill="#9aa3b2" font-size="12.5">cache · filas · sessões</text>

    <rect x="560" y="526" width="220" height="92" rx="10" fill="#111820" stroke="#2a3340"/>
    <text x="580" y="556" fill="#e6e8ee" font-size="15" font-weight="600">Meilisearch</text>
    <text x="580" y="578" fill="#9aa3b2" font-size="12.5">busca da aplicação</text>
  </g>

  <!-- ===== Conexões ===== -->
  <!-- Painel / Portal <-> Laravel -->
  <line x1="280" y1="149" x2="356" y2="180" stroke="#4d8dff" stroke-width="2" marker-start="url(#aFd)" marker-end="url(#aFd)"/>
  <text x="300" y="150" fill="#8b93a3" font-size="12">HTTP</text>
  <line x1="280" y1="245" x2="356" y2="300" stroke="#4d8dff" stroke-width="2" marker-start="url(#aFd)" marker-end="url(#aFd)"/>
  <text x="298" y="286" fill="#8b93a3" font-size="12">token</text>

  <!-- Laravel (api) -> n8n -->
  <path d="M660,396 L710,396 L710,141 L756,141" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#aFd2)"/>
  <text x="716" y="270" fill="#a9803a" font-size="12">eventos de OS</text>

  <!-- n8n <-> Agente IA -->
  <line x1="865" y1="172" x2="865" y2="184" stroke="#f59e0b" stroke-width="2" marker-start="url(#aFd2)" marker-end="url(#aFd2)"/>

  <!-- n8n -> Evolution -> WhatsApp -->
  <path d="M900,246 L900,258" fill="none" stroke="#f59e0b" stroke-width="0"/>
  <line x1="865" y1="246" x2="865" y2="258" stroke="#f59e0b" stroke-width="2" marker-end="url(#aFd2)"/>
  <line x1="865" y1="320" x2="865" y2="332" stroke="#f59e0b" stroke-width="2" marker-end="url(#aFd2)"/>

  <!-- Laravel -> bancos -->
  <path d="M470,450 L180,526" fill="none" stroke="#4d8dff" stroke-width="1.6" marker-end="url(#aFd)"/>
  <path d="M520,450 L440,526" fill="none" stroke="#4d8dff" stroke-width="1.6" marker-end="url(#aFd)"/>
  <path d="M560,450 L660,526" fill="none" stroke="#4d8dff" stroke-width="1.6" marker-end="url(#aFd)"/>
</svg>
